server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue history mode
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 前端容器代理到后端容器。docker-compose 中 BACKEND_UPSTREAM 默认是 http://robot-backend:8000
    location /api/ {
        proxy_pass ${BACKEND_UPSTREAM}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }



    # 视频流统一由后端提供，前端不直接访问 RTSP。
    # 支持 MJPEG / HLS / snapshot 等路径，例如：
    # /stream/cameras/{camera_id}/mjpeg
    # /stream/cameras/{camera_id}/snapshot
    # /stream/cameras/{camera_id}/hls/index.m3u8
    location /stream/ {
        proxy_pass ${BACKEND_UPSTREAM}/stream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header Cache-Control no-cache;
    }

    # WebSocket：后端推送实时状态、告警、检测结果时使用
    location /ws/ {
        proxy_pass ${BACKEND_UPSTREAM}/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
}
