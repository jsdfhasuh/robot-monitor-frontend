services:
  robot-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: robot-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # 后端如果已经在宿主机或别的机器运行，就改这里
      BACKEND_UPSTREAM: http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
