services:
  robot-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: robot-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # 前端容器内部通过 Docker 网络访问后端容器
      BACKEND_UPSTREAM: http://robot-backend:8000
    depends_on:
      - robot-backend
    networks:
      - robot-net

  # 这里不放后端代码，只保留容器位置。
  # 你后端项目单独构建镜像后，把 image 改成你的后端镜像名即可。
  robot-backend:
    image: robot-backend:latest
    container_name: robot-backend
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./backend-data:/app/data
      - ./models:/app/models
    environment:
      TZ: Asia/Shanghai
    networks:
      - robot-net

networks:
  robot-net:
    driver: bridge
